<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ease Health — Integrated Patient Care Management System">
    <meta name="theme-color" content="#0f3e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}Ease Health — Integrated Patient Care{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/branding/favicon.svg">
    <link rel="apple-touch-icon" href="/static/branding/icon-192.svg">
    <link rel="stylesheet" href="/static/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% if not request.session.get('user') %}no-sidebar{% endif %}">
    {% if request.session.get("user") %}
    {% include 'components/sidebar.html' %}
    {% endif %}

    <main class="main-content">
        {% block content %}{% endblock %}
        <footer class="page-footer">
            <p>Integrated Patient Care Management System</p>
        </footer>
    </main>

    <script src="/static/js/voice.js"></script>
    <script src="/static/js/ocr.js"></script>
    <script src="/static/js/chat.js"></script>
    {% block scripts %}{% endblock %}

    {% if request.session.get("user") %}
    <script>
        // Hamburger toggle
        const hamburger = document.getElementById('hamburger-btn');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const closeBtn = document.getElementById('sidebar-close');

        function openSidebar() {
            if(sidebar) sidebar.classList.add('open');
            if(backdrop) backdrop.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeSidebar() {
            if(sidebar) sidebar.classList.remove('open');
            if(backdrop) backdrop.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (hamburger) hamburger.addEventListener('click', openSidebar);
        if (backdrop) backdrop.addEventListener('click', closeSidebar);
        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);

        // Close on resize to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) closeSidebar();
        });

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
    {% endif %}
</body>
</html>
