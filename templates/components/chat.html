{% macro ai_chat(user_name, default_message="Hello, how can I help you today?", endpoint='/chat') %}
<div class="chat-container" id="chat-widget">
    <div style="padding: 16px; border-bottom: 1px solid var(--border-mist); background: var(--cream-paper);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0;">AI Clinical Assistant</h3>
            <div class="voice-controls">
                <label style="font-size:12px; display:flex; align-items:center; gap:4px;">
                    <input type="checkbox" id="voice-toggle"> Voice
                </label>
                <select id="voice-select" style="font-size:11px; padding:2px 4px; border-radius:4px; max-width:120px; border:1px solid var(--border-mist);"></select>
            </div>
        </div>
    </div>
    
    <div id="chat-messages" class="chat-messages">
        <div class="chat-bubble assistant animate-in">
            {{ default_message }}
        </div>
    </div>

    <!-- File preview area (hidden by default) -->
    <div id="file-preview-area" style="display:none; padding: 8px 12px; border-top: 1px solid var(--border-mist); background: var(--cream-paper);">
        <div id="file-preview" class="file-preview">
            <span id="file-preview-name"></span>
            <button type="button" class="remove-file" onclick="clearFileUpload()">&times;</button>
        </div>
    </div>
    
    <div class="chat-input-bar">
        <!-- File upload button -->
        <button type="button" class="btn-icon" onclick="document.getElementById('ocr-file-input').click()" title="Upload prescription image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="ocr-file-input" accept="image/*,.pdf" style="display:none" onchange="handleFileSelect(this)">
        
        <!-- Text input -->
        <input type="text" id="chat-input" placeholder="Type your query..." onkeypress="if(event.key === 'Enter') sendMessage()" style="min-width: 0; flex-grow: 1;">
        
        <!-- Voice input button -->
        <button type="button" class="btn-icon" id="voice-input-btn" onclick="toggleVoiceInput()" title="Voice input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        
        <!-- Send button -->
        <button type="button" class="btn-primary" style="width:auto; margin:0; padding: 10px 20px;" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- Hidden attribute to pass endpoint to JS -->
<script>window.__chatEndpoint = '{{ endpoint }}';</script>
{% endmacro %}
